# D-Robotics RDK-X5 Hardware Zero-Copy DirectVIV Configuration
vo=gpu
gpu-context=drm
drm-connector=HDMI-A-1
drm-mode=1920x1080@60.00
hwdec=vaapi
ao=pulse
vd-lavc-software-fallback=1
audio-buffer=1
fs=yes
input-default-bindings=yes
osc=yes

# YouTube & Network Streaming (H.264 up to 1080p for Wave521 VPU + DirectVIV)
ytdl-format=bestvideo[vcodec^=avc1][height<=1080]+bestaudio/best[vcodec^=avc1]/best
demuxer-max-bytes=64MiB
demuxer-readahead-secs=20

# Fallback profile for X11 desktop sessions (mpv --profile=x11 <file>)
[x11]
vo=x11
hwdec=vaapi-copy
sws-allow-zimg=no
sws-scaler=fast-bilinear
sws-fast=yes

# Auto-profile for HLS and Live streams (HLS chunk switching -> robust CPU software decode)
[hls-live]
profile-desc="HLS / Live Stream SW Decoding"
profile-cond=get("file-format", "") == "hls" or string.find(get("path", ""), "m3u8") ~= nil or string.find(get("path", ""), "/live/") ~= nil
profile-restore=copy
hwdec=no
